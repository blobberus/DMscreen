# Publishes the DM Screen website to GitHub Pages whenever sounds or the app change.
# screen/setup.json (flags, pads, keys) is read live by the site, so saving it doesn't rebuild.
name: Publish the DM screen

on:
  push:
    branches: [main]
    paths-ignore: ['screen/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install imageio-ffmpeg
      - name: Reuse waveforms from earlier builds
        uses: actions/cache@v4
        with:
          path: .site-cache
          key: waveforms-${{ github.run_id }}
          restore-keys: waveforms-
      - run: python tools/build_site.py --out _site --cache .site-cache
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
